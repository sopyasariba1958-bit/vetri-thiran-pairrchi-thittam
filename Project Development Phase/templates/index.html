<!DOCTYPE html>
<html>
<head>
    <title>ComicCraft - Home</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            
            background-image: url('/static/hero_banner.jpg');
            background-size: cover; 
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            
            display: flex; 
            justify-content: center; 
            align-items: center;
            padding: 50px; 
            margin: 0;
            min-height: 100vh;
        }
        
        .form-container { 
            
            background: rgba(255, 255, 255, 0.92); 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 8px 16px rgba(0,0,0,0.5); 
            width: 100%; 
            max-width: 500px; 
        }
        
        h2 { text-align: center; color: #222; margin-top: 0; font-size: 28px; }
        form { text-align: left; }
        label { font-weight: bold; color: #444; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 10px; margin: 8px 0 15px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Create Your Comic</h2>
        <form action="/generate" method="post">
            <label>Story Prompt:</label>
            <textarea name="prompt" rows="3" required placeholder="A brave fox exploring an enchanted forest..."></textarea>
            
            <label>Main Character Name:</label>
            <input type="text" name="character_name" required>
            
            <label>Setting:</label>
            <select name="setting">
                <option value="Forest">Forest</option>
                <option value="City">City</option>
                <option value="Space">Space</option>
            </select>
            
            <label>Story Tone:</label>
            <select name="tone">
                <option value="Dramatic">Dramatic</option>
                <option value="Funny">Funny</option>
                <option value="Light-hearted">Light-hearted</option>
            </select>
            
            <label>Art Style:</label>
            <select name="style">
                <option value="Anime">Anime</option>
                <option value="Realistic">Realistic</option>
                <option value="Comic Book">Comic Book</option>
            </select>
            
            <button type="submit">Generate Comic</button>
        </form>
    </div>
</body>
</html>
